    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB-zndubu14oVmAK3lTQNBMiEQKYb315iU",
            authDomain: "hyper-pro-a2732.firebaseapp.com",
            projectId: "hyper-pro-a2732",
            storageBucket: "hyper-pro-a2732.firebasestorage.app",
            messagingSenderId: "68141044659",
            appId: "1:68141044659:web:73e8ac934851fa05ae71c6",
            measurementId: "G-Q3CRL7XB44"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const toolsContainer = document.getElementById('tools-container');
        const toolsLoader = document.getElementById('tools-loader');
        const searchInput = document.getElementById('tool-search');
        let allTools = [];

        async function loadTools() {
            try {
                const q = query(collection(db, "tools"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                allTools = [];
                querySnapshot.forEach((doc) => {
                    allTools.push({ id: doc.id, ...doc.data() });
                });
                displayTools(allTools);
            } catch (error) {
                console.error("Error fetching tools:", error);
                if (toolsContainer) toolsContainer.innerHTML = `<p class="col-span-full text-center text-red-400">Failed to load tools.</p>`;
            } finally {
                if(toolsLoader) toolsLoader.style.display = 'none';
            }
        }

        function displayTools(tools) {
            if (!toolsContainer) return;
            toolsContainer.innerHTML = '';
            if (tools.length === 0) {
                toolsContainer.innerHTML = `<p class="col-span-full text-center text-gray-500">No tools found.</p>`;
                return;
            }
            tools.forEach((tool, index) => {
                const toolCard = document.createElement('div');
                toolCard.className = `premium-glass glass-hover p-8 md:p-10 rounded-2xl border-t-4 border-t-yellow-400 active group`;
                
                let iconHtml = '';
                if (tool.emoji) {
                    iconHtml = `<span class="text-5xl block text-center">${tool.emoji}</span>`;
                } else if (tool.iconClass) {
                    iconHtml = `<i class="${tool.iconClass} text-4xl text-yellow-400"></i>`;
                } else if (tool.iconUrl) {
                    iconHtml = `<img src="${tool.iconUrl}" class="w-10 h-10 object-contain rounded" alt="${tool.name}">`;
                } else {
                    iconHtml = `<i class="fas fa-wrench text-4xl text-yellow-400"></i>`;
                }

                toolCard.innerHTML = `
                    <div class="w-16 h-16 rounded-2xl bg-yellow-400/20 flex items-center justify-center mb-8 group-hover:scale-110 transition-transform duration-500 group-hover:bg-yellow-400/30">${iconHtml}</div>
                    <h4 class="text-2xl md:text-3xl font-bold mb-4">${tool.name}</h4>
                    <p class="text-gray-400 leading-relaxed mb-6">${tool.description || ''}</p>
                    <a href="${tool.url}" target="_blank" class="inline-flex items-center gap-2 text-yellow-400 hover:text-yellow-300 font-semibold transition-colors">Open Tool <i class="fas fa-arrow-right text-sm"></i></a>
                `;
                toolsContainer.appendChild(toolCard);
            });
        }

        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase().trim();
                if (!term) {
                    displayTools(allTools);
                    return;
                }

                const filtered = allTools
                    .map(tool => {
                        let score = 0;
                        const name = tool.name.toLowerCase();
                        const desc = (tool.description || "").toLowerCase();
                        const tags = (tool.tags || "").toLowerCase();
                        
                        // Exact match in name
                        if (name === term) score += 100;
                        // Name starts with term
                        else if (name.startsWith(term)) score += 80;
                        // Name includes term
                        else if (name.includes(term)) score += 60;
                        
                        // Tags include term (High boost)
                        if (tags.split(',').map(tag => tag.trim().toLowerCase()).includes(term)) score += 95;
                        else if (tags.includes(term)) score += 70;
                        
                        // Description includes term
                        if (desc.includes(term)) score += 30;
                        
                        return { ...tool, score };
                    })
                    .filter(t => t.score > 0)
                    .sort((a, b) => b.score - a.score);
                    
                displayTools(filtered);
            });
        }
        loadTools();

        // Mobile Menu Toggle
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');
        mobileMenuButton.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });
    </script>
